<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="720" height="590" fill="#0d1117"/>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>
<rect x="40" y="24" width="330" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="205.0" y="50.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Embench programs</text>
<text x="205.0" y="64.0" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">benchmarks/embench, 8 programs</text>
<line x1="205.0" y1="78.0" x2="205.0" y2="119.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#head)"/>
<text x="221.0" y="91.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="bold" dominant-baseline="middle">ELF per program</text>
<text x="221.0" y="108.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" dominant-baseline="middle">-march=rv32im -mabi=ilp32 -O2, main's linker script</text>
<rect x="40" y="122" width="330" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="205.0" y="148.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Spike</text>
<text x="205.0" y="162.0" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">commit log → src/tracing.py</text>
<line x1="205.0" y1="176.0" x2="205.0" y2="217.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#head)"/>
<text x="221.0" y="189.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="bold" dominant-baseline="middle">trace .jsonl</text>
<text x="221.0" y="206.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" dominant-baseline="middle">one line per retired instruction</text>
<rect x="40" y="220" width="330" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="205.0" y="246.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Candidate finder</text>
<text x="205.0" y="260.0" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">src/candidates.py</text>
<line x1="205.0" y1="274.0" x2="205.0" y2="315.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#head)"/>
<text x="221.0" y="287.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="bold" dominant-baseline="middle">candidates JSON</text>
<text x="221.0" y="304.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" dominant-baseline="middle">formula, size, runs, places, saved</text>
<rect x="40" y="318" width="330" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="205.0" y="344.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Selection</text>
<text x="205.0" y="358.0" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">frequency ranking or ML-guided</text>
<line x1="205.0" y1="372.0" x2="205.0" y2="413.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#head)"/>
<text x="221.0" y="385.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="bold" dominant-baseline="middle">selected formulas</text>
<text x="221.0" y="402.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" dominant-baseline="middle">1 to 3 per core</text>
<rect x="40" y="416" width="330" height="52" rx="6" fill="#3987e5" stroke="#3987e5" stroke-width="1.2"/>
<text x="205.0" y="442.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Hardware measurement (hw/)</text>
<text x="205.0" y="456.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal" dominant-baseline="middle">PicoRV32 + PCPI unit, Verilator, Yosys, nextpnr</text>
<line x1="205.0" y1="470.0" x2="205.0" y2="511.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#head)"/>
<text x="221.0" y="483.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="bold" dominant-baseline="middle">measurement rows</text>
<text x="221.0" y="500.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" dominant-baseline="middle">candidate_id, cycles, periods, LUTs, speedup</text>
<rect x="40" y="514" width="330" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="205.0" y="540.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold" dominant-baseline="middle">ML side / selection</text>
<text x="205.0" y="554.0" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">rows feed the next round</text>
</svg>
