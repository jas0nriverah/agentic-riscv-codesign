[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaforge"
version = "0.1.0"
description = "Measured-data learning and selection for RISC-V custom instruction candidates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "xgboost>=2.1,<4", "joblib>=1.4,<2"]

[project.urls]
Repository = "https://github.com/jas0nriverah/agentic-riscv-codesign"
Issues = "https://github.com/jas0nriverah/agentic-riscv-codesign/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
reports = ["matplotlib>=3.8,<4"]

[project.scripts]
isaforge = "isaforge.cli:main"

[tool.setuptools.packages.find]
include = ["isaforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
