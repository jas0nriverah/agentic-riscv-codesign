<text x="70.0" y="770.0" text-anchor="start" font-size="14" fill="#253347" font-weight="bold">How to read it</text>
<text x="70.0" y="797.0" text-anchor="start" font-size="14" fill="#253347" font-weight="normal">Green features push the rank score up; red features push it down. The contributions plus the base score sum to the raw score.</text>
<text x="70.0" y="823.0" text-anchor="start" font-size="12" fill="#607084" font-weight="normal">A rank score only orders candidates. It is not an estimated speedup, calibrated probability, or causal feature effect.</text>
<text x="70.0" y="847.0" text-anchor="start" font-size="12" fill="#607084" font-weight="normal">Measured outcome is shown only to explain the miss; the held-out label was not a model input.</text>
