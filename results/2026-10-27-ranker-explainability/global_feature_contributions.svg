<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
<title>What drives the XGBoost pairwise ranker?</title>
<desc>Equal-workload average of each candidate&#x27;s normalized absolute additive tree contributions. Bars are descriptive workload-bootstrap intervals and are not causal effects.</desc>
