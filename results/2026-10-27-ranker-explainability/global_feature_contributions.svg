<text x="70.0" y="90.0" text-anchor="start" font-size="16" fill="#526174" font-weight="normal">Native additive tree contributions · 14 workload-held-out fits · 122 measured labels</text>
<text x="70.0" y="119.0" text-anchor="start" font-size="14" fill="#526174" font-weight="normal">Each held-out fit excludes the entire workload and related formula families. Larger values mean more influence on the model&#x27;s ordering score.</text>
