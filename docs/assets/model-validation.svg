<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="240" viewBox="0 0 1040 240" role="img" aria-labelledby="title desc">
<title id="title">How a model earns promotion</title><desc id="desc">Declare a bounded experiment, develop the model, freeze its predictions and fresh inputs, measure circuits, then check both accuracy and hardware-budget errors. Failures and incomplete cohorts keep the default unchanged.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#52657d" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="240" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="40" font-size="22" fill="#172b4d" font-weight="600">How a model earns promotion</text>
<rect x="32" y="78" width="176" height="84" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="48" y="107" font-size="17" fill="#172b4d" font-weight="600">Declare</text><text x="48" y="133" font-size="14" fill="#52657d" font-weight="400">Hypothesis + limits</text><path d="M208 120 H228" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="232" y="78" width="176" height="84" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="248" y="107" font-size="17" fill="#172b4d" font-weight="600">Develop</text><text x="248" y="133" font-size="14" fill="#52657d" font-weight="400">Features or coverage</text><path d="M408 120 H428" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="432" y="78" width="176" height="84" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="448" y="107" font-size="17" fill="#172b4d" font-weight="600">Freeze</text><text x="448" y="133" font-size="14" fill="#52657d" font-weight="400">Model + fresh inputs</text><path d="M608 120 H628" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="632" y="78" width="176" height="84" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="648" y="107" font-size="17" fill="#172b4d" font-weight="600">Measure</text><text x="648" y="133" font-size="14" fill="#52657d" font-weight="400">New circuit labels</text><path d="M808 120 H828" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="832" y="78" width="176" height="84" rx="6" fill="#edf3fa" stroke="#a8bfd9"/><text x="848" y="107" font-size="17" fill="#172b4d" font-weight="600">Evaluate</text><text x="848" y="133" font-size="14" fill="#52657d" font-weight="400">Accuracy + budgets</text>
<text x="32" y="212" font-size="15" fill="#52657d" font-weight="400">Promote only when all gates pass. Failed or incomplete validation keeps the current default.</text>
</g></svg>
