<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
<title id="title">The ML model</title><desc id="desc">217 selected circuit features feed 300 ExtraTrees regressors. Each tree sees the same 1,665 training circuits with randomized splits; tree predictions are averaged. Three representative trees are shown.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#52657d" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="390" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="40" font-size="22" fill="#172b4d" font-weight="600">The ML model</text>
<rect x="32" y="162" width="176" height="84" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="48" y="191" font-size="17" fill="#172b4d" font-weight="600">RV32 formula</text><text x="48" y="217" font-size="14" fill="#52657d" font-weight="400">Two-input computation</text><rect x="232" y="162" width="176" height="84" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="248" y="191" font-size="17" fill="#172b4d" font-weight="600">Graph features</text><text x="248" y="217" font-size="14" fill="#52657d" font-weight="400">336 cached → 217 used</text><path d="M208 204 H228" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="432" y="72" width="176" height="72" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="448" y="101" font-size="17" fill="#172b4d" font-weight="600">Tree 1</text><text x="448" y="127" font-size="14" fill="#52657d" font-weight="400">Randomized splits</text><path d="M408 204 H420 V108 H428" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M608 108 H620 V204 H628" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="432" y="162" width="176" height="72" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="448" y="191" font-size="17" fill="#172b4d" font-weight="600">Tree 2</text><text x="448" y="217" font-size="14" fill="#52657d" font-weight="400">Randomized splits</text><path d="M408 204 H420 V198 H428" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M608 198 H620 V204 H628" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="432" y="252" width="176" height="72" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="448" y="281" font-size="17" fill="#172b4d" font-weight="600">Tree 300</text><text x="448" y="307" font-size="14" fill="#52657d" font-weight="400">Randomized splits</text><path d="M408 204 H420 V288 H428" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M608 288 H620 V204 H628" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="632" y="162" width="176" height="84" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="648" y="191" font-size="17" fill="#172b4d" font-weight="600">Average</text><text x="648" y="217" font-size="14" fill="#52657d" font-weight="400">Equal tree weights</text><rect x="832" y="162" width="176" height="84" rx="6" fill="#edf3fa" stroke="#a8bfd9"/><text x="848" y="191" font-size="17" fill="#172b4d" font-weight="600">Area estimate</text><text x="848" y="217" font-size="14" fill="#52657d" font-weight="400">Predicted iCE40 LUT4</text><path d="M808 204 H828" fill="none" stroke="#52657d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="432" y="60" font-size="14" fill="#52657d" font-weight="400">300-TREE ENSEMBLE</text>
<text x="32" y="362" font-size="15" fill="#52657d" font-weight="400">1,665 training circuits · all trees see the same training set · estimates are not calibrated safety bounds.</text>
</g></svg>
