<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310" role="img" aria-labelledby="title desc">
<title id="title">What improved — and what did not</title><desc id="desc">Three separate studies. Mapping descriptors reduce MAE from34.33 to32.16 on192 synthetic circuits. Added training coverage worsens application family-macro MAE from0.5066 to0.5252. Arithmetic coverage reduces MAE from15.52 to12.01 on32 related circuits but worsens worst underprediction.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#52657d" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="310" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="40" font-size="22" fill="#172b4d" font-weight="600">What improved — and what did not</text>
<rect x="32" y="78" width="312" height="170" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="48" y="107" font-size="17" fill="#172b4d" font-weight="600">Representation</text><text x="48" y="133" font-size="14" fill="#52657d" font-weight="400">192 synthetic circuits</text><text x="48" y="167" font-size="20" fill="#172b4d" font-weight="600">34.33 → 32.16 LUT4</text><text x="48" y="194" font-size="15" fill="#52657d" font-weight="400">6.32% lower MAE</text><text x="48" y="225" font-size="14" fill="#172b4d" font-weight="600">Base retained</text><rect x="364" y="78" width="312" height="170" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="380" y="107" font-size="17" fill="#172b4d" font-weight="600">Training coverage</text><text x="380" y="133" font-size="14" fill="#52657d" font-weight="400">327 application circuits</text><text x="380" y="167" font-size="20" fill="#172b4d" font-weight="600">0.5066 → 0.5252 LUT4</text><text x="380" y="194" font-size="15" fill="#52657d" font-weight="400">3.68% worse family MAE</text><text x="380" y="225" font-size="14" fill="#172b4d" font-weight="600">No transfer gain</text><rect x="696" y="78" width="312" height="170" rx="6" fill="#f7f9fc" stroke="#c7d0db"/><text x="712" y="107" font-size="17" fill="#172b4d" font-weight="600">Arithmetic coverage</text><text x="712" y="133" font-size="14" fill="#52657d" font-weight="400">32 related circuits</text><text x="712" y="167" font-size="20" fill="#172b4d" font-weight="600">15.52 → 12.01 LUT4</text><text x="712" y="194" font-size="15" fill="#52657d" font-weight="400">22.63% lower MAE</text><text x="712" y="225" font-size="14" fill="#172b4d" font-weight="600">Worse underprediction tail</text>
<text x="32" y="282" font-size="15" fill="#52657d" font-weight="400">Separate cohorts and metrics, not one learning curve. Better mean error alone does not justify promotion.</text>
</g></svg>
