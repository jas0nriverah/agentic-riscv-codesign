name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: isaforge demo --output generated/demo
      - run: python -m isaforge.frozen_inference --model results/2026-10-13-prospective/models/resource-ridge.joblib --kind v2 --candidates results/2026-10-13-prospective/final/dataset.json --output generated/inference-smoke.json
      - run: python -m isaforge.frozen_inference --model results/2026-10-13-v3/models/area-model-v3.joblib --kind v3 --candidates results/2026-10-13-v3/probe/candidates.json --output generated/v3-inference-smoke.json
      - run: python scripts/reproduce_matched.py --skip-figures --output generated/ci-replay
      - run: python scripts/evaluate_v4.py --manifest results/2026-10-13-v4/freeze.json --release results/2026-10-13-v4/label-release.json --output generated/ci-v4/evaluation.json
      - run: python scripts/evaluate_v5.py --root results/2026-10-14-v5 --output generated/ci-v5/evaluation.json
      - run: python scripts/archive_external_v5.py restore
      - run: python scripts/evaluate_external_v5.py score --output generated/ci-external-v5/evaluation.json
  hardware-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y verilator yosys
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_rtl.py tests/test_synthesis.py tests/test_masterrtl_baseline.py
