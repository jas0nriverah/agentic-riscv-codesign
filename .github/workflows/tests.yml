name: Research snapshot checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.python-version == '3.13'
        run: python -m pip install -e '.[dev,reports]' -r requirements-research.txt
      - if: matrix.python-version == '3.11'
        run: python -m pip install -e '.[dev,reports]'
      - run: make test
      - run: make reproduce
      - if: matrix.python-version == '3.13'
        run: make predict
  hardware-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y verilator yosys
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_rtl.py tests/test_synthesis.py tests/test_masterrtl_baseline.py
